# Postgres for the web app. Bound to localhost only; port 5590 avoids the
# other Postgres instances already running on this machine.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: tradingagents
      POSTGRES_DB: tradingagents
    ports:
      - "127.0.0.1:5590:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingagents"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
