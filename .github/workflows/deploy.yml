name: Deploy

# Ships one commit to production, started by hand: Actions, Deploy, Run workflow,
# from the branch to ship. It runs the web checks on that commit first (web.yml),
# packs the repository at it, and hands the pack over SSH to the server's deploy
# command (web/deploy/receive-release.sh, the deploy key's only command), which
# builds, migrates, replaces the app and the worker, waits for health, and rolls
# back on failure. A staging server would get an automatic job here once it exists.
#
# Secrets (docs/runbooks/deploy.md): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (the
# private key whose only command on the server is the deploy) and
# DEPLOY_KNOWN_HOSTS (the server's host key line, so no other machine is trusted).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik "deploy" untuk mengirim commit ini ke produksi'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: inputs.confirm == 'deploy'
    uses: ./.github/workflows/web.yml

  deploy:
    name: deploy to production
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Pack the release
        run: git archive --format=tar.gz -o release.tar.gz "$GITHUB_SHA"
      - name: Ship it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA" < release.tar.gz
